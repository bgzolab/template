<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Bangumi Data 批量操作</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .controls { margin-bottom: 20px; }
        .item-list { margin-top: 20px; }
        .item { margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="controls">
        年份：<input type="number" id="year" value="2024" min="2000" max="2100">
        月份：<input type="number" id="month" value="1" min="1" max="12">
        <button onclick="loadData()">加载数据</button>
        <button onclick="submitBatch()">批量提交</button>
    </div>
    <div id="item-list" class="item-list"></div>
    <script>
        let selectedIds = [];
        function getName(item){
            if (item.titleTranslate && item.titleTranslate["zh-Hans"] && item.titleTranslate["zh-Hans"].length > 0) {
                return item.titleTranslate["zh-Hans"][0];
            }
            if (item.titleTranslate && item.titleTranslate["zh-Hant"] && item.titleTranslate["zh-Hant"].length > 0) {
                return item.titleTranslate["zh-Hant"][0];
            }
            return item.title;
        }
        function getBgmId(item){
            if (!item.sites){
                return null
            }
            for (const i of item['sites']) {
                if (i && i['site'] === 'bangumi') {
                    return i['id'];
                }
            }
            return '';
        }
        function toggleSelect(checkbox) {
            const id = parseInt(checkbox.value);
            if (checkbox.checked) {
                if (!selectedIds.includes(id)) selectedIds.push(id);
            } else {
                selectedIds = selectedIds.filter(i => i !== id);
            }
        }
        function submitBatch() {
            if (selectedIds.length === 0) {
                alert('请至少选择一个条目');
                return;
            }
            fetch('/api/batch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ids: selectedIds })
            })
            .then(res => res.json())
            .then(data => {
                alert(`已处理 ${data.count} 个条目`);
            });
        }
        function renderItem(item) {
            const div = document.createElement('div');
            div.className = 'item';
            const bgmId = getBgmId(item);
            let imgHtml = '';
            if (bgmId) {
                imgHtml = `<img src="https://api.bgm.tv/v0/subjects/${bgmId}/image?type=common" alt="cover" style="width:200px;height:auto;vertical-align:middle;margin-right:8px;" onerror="this.style.display='none'">`;
            }
            div.innerHTML = `${imgHtml}<input type='checkbox' value='${bgmId}' onchange='toggleSelect(this)'> ${getName(item)} (ID: ${bgmId})`;
            return div;
        }
        function loadData() {
            const year = document.getElementById('year').value;
            const month = document.getElementById('month').value;
            fetch(`/api/data?year=${year}&month=${month}`)
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('item-list');
                    list.innerHTML = '';
                    selectedIds = [];
                    if (data.data && data.data.length > 0) {
                        data.data.forEach(item => {
                            list.appendChild(renderItem(item));
                        });
                    } else {
                        list.innerHTML = '无数据';
                    }
                });
        }
    </script>
</body>
</html>
