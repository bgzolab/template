[project]
name = "Dashboard"
version = "0.1.0"
description = "bGZo's Playground scripts"
authors = [
    {name = "hx",email = "im@bgzo.cc"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click (==8.2.1)",
    "certifi (==2025.8.3)",
    "cffi (==1.17.1)",
    "charset-normalizer (==3.4.3)",
    "cryptography (==45.0.7)",
    "idna (==3.10)",
    "pycparser (==2.22)",
    "pygithub (==2.8.1)",
    "pyjwt (==2.10.1)",
    "pynacl (==1.5.0)",
    "requests (==2.32.5)",
    "typing-extensions (==4.15.0)",
    "urllib3 (==2.5.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
github_fetch="github_repo_stats:start_fetch_data"
