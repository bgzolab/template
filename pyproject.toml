[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "venera-parser-bangumi"
version = "0.1.2"
description = "Parse Venera exports and sync selected favorites to Bangumi."
authors = [
    {name = "hx",email = "im@bgzo.cc"}
]
license = {text = "AGPL-3.0"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "click>=8.1,<9",
  "opencc-python-reimplemented>=0.1.7",
]

[project.urls]
"Repository" = "https://github.com/bgzo/playground/tree/2026/05/venera-parser-bangumi-sync"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
venera-sync-bangumi = "venera_parser_bangumi.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.poetry]
packages = [
    { include = "*", from = "src" }
]

[tool.poetry.scripts]
venera-sync-bangumi = "venera_parser_bangumi.cli:main"
