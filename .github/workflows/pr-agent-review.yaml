name: pr-agent-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pr-agent-review:
    if: github.event.pull_request.user.login == 'bgzo'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: PR Agent review
        uses: the-pr-agent/pr-agent@main
        env:
          # The action is event-driven: on pull_request events it auto-runs its
          # tools (describe/review/improve). There is no `command` input. PR-Agent
          # reads settings env vars with NO prefix (envvar_prefix=False), so use
          # SECTION__KEY, not PR_AGENT__SECTION__KEY. This is inlined here; if it
          # grows, it can be split out into a root .pr_agent.toml or your dotfiles.
          CONFIG__MODEL: "openai/glm-5.3-flash"
          CONFIG__FALLBACK_MODELS: '["openai/glm-5.3-flash"]'
          CONFIG__CUSTOM_MODEL_MAX_TOKENS: "32768"
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "false"
          # Route to the opencode-go OpenAI-compatible endpoint.
          # OPENAI_KEY (single underscore) is read by the runner and overrides any
          # repo/org OPENAI_KEY secret, so point it at opencode-go.
          OPENAI_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENAI__API_BASE: ${{ vars.OPENCODE_API_BASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}