name: Deploy to bgzo.github.io

on:
  push:
    branches:
      - "2025/10/blog-astro"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build site
        run: bun run build
        env:
          NODE_ENV: production

      - name: Deploy to bGZo/bgzo.github.io
        env:
          DEPLOY_TOKEN: ${{ secrets.REPO_BGZO_GITHUB_IO_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cd dist/client
          git init
          git add -A
          git commit -m "chore: deploy from playground"
          git push --force \
            "https://x-access-token:${DEPLOY_TOKEN}@github.com/bGZo/bgzo.github.io.git" \
            HEAD:gh-pages
