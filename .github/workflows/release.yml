name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - "*" # 任何 tag 都会触发，比如 v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要这个权限才能发布 release

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: |
          mkdir -p dist
          go build -o dist/tg .


      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/tg"            # 上传的构建产物
          tag: ${{ github.ref_name }}     # 使用当前推送的 tag
          allowUpdates: true              # 如果已有 Release 则更新它
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
