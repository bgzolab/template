name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - "*" # 任何 tag 都会触发，比如 v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要这个权限才能发布 release
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [amd64, arm64]
    env:
      GOOS: ${{ matrix.os == 'windows-latest' && 'windows' || matrix.os == 'macos-latest' && 'darwin' || 'linux' }}
      GOARCH: ${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v4


      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'


      - name: Download dependencies
        run: go mod download


      - name: Build
        run: |
          output_name="tg-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            output_name="${output_name}.exe"
          fi
          GOOS=${{ env.GOOS }} GOARCH=${{ env.GOARCH }} go build -o dist/$output_name

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: dist/


  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_type == 'tag' && github.ref_name || 'Lastest' }}
          # ↑ 如果是 tag 触发，则使用；否则为空，避免乱打 tag
          artifacts: "dist/*"
          draft: false
          prerelease: false
          allowUpdates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
