name: Daily Repository Stats Update

on:
  schedule:
    # 每天凌晨 2 点运行 (UTC)
    - cron: '0 2 * * *'
  workflow_dispatch:  # 允许手动触发
    inputs:
      branch:
        description: 'Target branch to deploy from'
        required: false
        default: 'dashboard'
        type: string
  push:
    branches:
      - dashboard  # 面板主分支

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    if: github.ref == 'refs/heads/dashboard' || github.event_name == 'schedule'

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch || github.ref }}

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run data collection script
      env:
        GITHUB_TOKEN: ${{ secrets.G_TOKEN }}
      run: |
        python github_repo_stats.py -u bGZo -p playground -o ./web-vue/public/

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: './web-vue/package-lock.json'

    - name: Clean and install Node.js dependencies
      working-directory: ./web-vue
      run: |
        npm ci

    - name: Build web application (Vite)
      working-directory: ./web-vue
      run: |
        npm run build

    - name: List built files
      run: |
        ls -la ./web-vue/dist

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './web-vue/dist'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  deploy-vercel:
    runs-on: ubuntu-latest
    needs: update-and-deploy
    if: ${{ vars.ENABLE_VERCEL_DEPLOY == 'true' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '23'
        cache: 'npm'
        cache-dependency-path: './web-vue/package-lock.json'

    - name: Install dependencies
      working-directory: ./web-vue
      run: npm ci

    - name: Deploy to Vercel
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        vercel-args: '--prod'
        vercel-org-id: ${{ secrets.ORG_ID }}
        vercel-project-id: ${{ secrets.PROJECT_ID }}
        working-directory: ./web-vue
