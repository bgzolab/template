name: Daily Repository Stats Update

on:
  schedule:
    # 每天凌晨 2 点运行 (UTC)
    - cron: '0 2 * * *'
  workflow_dispatch:  # 允许手动触发
    inputs:
      branch:
        description: 'Target branch to deploy from'
        required: false
        default: 'dashboard'
        type: string
  push:
    branches:
      - dashboard  # 面板主分支

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    # 只有在主分支或定时任务时才部署到 GitHub Pages
    if: github.ref == 'refs/heads/dashboard' || github.event_name == 'schedule'

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch || github.ref }}

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run data collection script
      env:
        GITHUB_TOKEN: ${{ secrets.G_TOKEN }}
      run: |
        python github_repo_stats.py -u bGZo -p playground -o ./web/public/

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Clean and install Node.js dependencies
      working-directory: ./web
      run: |
        npm cache clean --force
        rm -rf node_modules package-lock.json
        npm install --legacy-peer-deps

    - name: Build web application
      working-directory: ./web
      run: |
        npm run build
        npm run generate

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './web/.output/public'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  # 可选：同时部署到 Vercel
  deploy-vercel:
    runs-on: ubuntu-latest
    needs: update-and-deploy
    if: ${{ vars.ENABLE_VERCEL_DEPLOY == 'true' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: './web/package-lock.json'

    - name: Install dependencies
      working-directory: ./web
      run: npm ci

    - name: Deploy to Vercel
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        vercel-args: '--prod'
        vercel-org-id: ${{ secrets.ORG_ID }}
        vercel-project-id: ${{ secrets.PROJECT_ID }}
        working-directory: ./web

